services:
  caddy:
    image: caddy:2
    container_name: infra-caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy_network

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy_network:
    external: true
    name: proxy_network
